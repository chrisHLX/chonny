<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 19 19" fill="none">
  <!-- Vertical arm: starts 4px below corner, leaving a subtle gap -->
  <line x1="0" y1="16" x2="0" y2="4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Horizontal arm: full length from corner -->
  <line x1="0" y1="0" x2="16" y2="0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
