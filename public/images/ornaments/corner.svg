<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 43 43" fill="none">
  <!-- Main L-bracket arms -->
  <line x1="0" y1="40" x2="0" y2="8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="0" y1="0" x2="40" y2="0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Chamfer cut across the inner corner -->
  <line x1="0" y1="8" x2="8" y2="0" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Inner cross-hair ticks -->
  <line x1="12" y1="0" x2="12" y2="10" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="0" y1="12" x2="10" y2="12" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Accent dot at crosshair intersection -->
  <circle cx="12" cy="12" r="2.5" fill="currentColor" opacity="0.7"/>
  <!-- Crosshair tails extending past the dot -->
  <line x1="14.5" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="12" y1="14.5" x2="12" y2="22" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>
</svg>
